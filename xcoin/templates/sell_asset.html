{% extends "base.html" %}

{% block title %}
Sell {{ asset.name }}
{% endblock %}

{% block content %}

<section
class="max-w-6xl mx-auto p-6"

x-data="{

price: {{ asset.current_price }},

owned: {{ portfolio.quantity }},

quantity:0,

total(){

if(!this.quantity) return 0;

return (this.quantity*this.price).toFixed(2)

}

}">

<div class="grid lg:grid-cols-3 gap-8">

<div class="lg:col-span-2">

<div class="glass rounded-3xl border border-zinc-800 p-8">

<div class="flex items-center gap-5 mb-8">

{% if asset.logo %}

<img

src="{{ asset.logo.url }}"

class="w-16 h-16 rounded-full">

{% endif %}

<div>

<p class="uppercase tracking-[0.3em] text-xs text-red-500">

Sell Asset

</p>

<h1 class="text-4xl font-black">

{{ asset.name }}

</h1>

<p class="text-zinc-500">

{{ asset.symbol }}

</p>

</div>

</div>

<form
method="POST"
action="{% url 'sell_asset' asset.id %}">

{% csrf_token %}

<label class="block font-semibold mb-3">

Quantity to Sell

</label>

<input

type="number"

name="quantity"

step="0.00000001"

min="0.00000001"

max="{{ portfolio.quantity }}"

required

x-model.number="quantity"

placeholder="Enter quantity"

class="w-full
h-16
rounded-2xl
bg-zinc-950
border-2
border-zinc-800
focus:border-red-600
outline-none
px-5">

<div class="grid md:grid-cols-2 gap-6 mt-8">

<div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-6">

<p class="text-zinc-500 text-sm">

Current Price

</p>

<h3 class="text-3xl font-bold mt-2">

${{ asset.current_price }}

</h3>

</div>

<div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-6">

<p class="text-zinc-500 text-sm">

You Own

</p>

<h3 class="text-3xl font-bold mt-2">

{{ portfolio.quantity }}

</h3>

</div>

</div>

<div class="rounded-2xl bg-green-600 mt-8 p-6">

<p class="text-green-100">

Estimated Credit

</p>

<h2 class="text-4xl font-black mt-2">

$

<span x-text="total()"></span>

</h2>

</div>

<div class="mt-8">

<button

type="submit"

class="w-full
h-16
rounded-2xl
bg-red-600
hover:bg-red-700
transition
font-bold
text-lg">

Sell {{ asset.symbol }}

</button>

</div>

</form>

</div>

</div>
