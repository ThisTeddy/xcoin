{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>

Register | XCoin

</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#09090B;
color:white;
}

.glass{
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
}

.input{
width:100%;
padding:15px;
background:#18181B;
border:1px solid #333;
border-radius:14px;
color:white;
outline:none;
transition:.3s;
}

.input:focus{
border-color:#DC2626;
}

.btn{
width:100%;
padding:15px;
background:#DC2626;
border-radius:14px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:#ef4444;
}

</style>

</head>

<body>

<div class="min-h-screen flex items-center justify-center px-5 py-10">

<div class="glass rounded-3xl w-full max-w-2xl p-8">

<div class="text-center mb-8">

<div class="w-16 h-16 rounded-2xl bg-red-600 mx-auto flex items-center justify-center text-3xl font-black">

X

</div>

<h1 class="text-4xl font-black mt-5">

Create Account

</h1>

<p class="text-zinc-400 mt-2">

Start trading Crypto, Stocks and Investment Plans.

</p>

</div>

{% if messages %}

{% for message in messages %}

<div class="mb-5 p-4 rounded-xl bg-red-500/20 border border-red-500">

{{ message }}

</div>

{% endfor %}

{% endif %}

<form method="POST">

{% csrf_token %}

<div class="grid md:grid-cols-2 gap-5">

<div>

<label class="block mb-2">

Username

</label>

<input
type="text"
name="username"
class="input"
required>

</div>

<div>

<label class="block mb-2">

Email

</label>

<input
type="email"
name="email"
class="input"
required>

</div>

<div>

<label class="block mb-2">

Phone

</label>

<input
type="text"
name="phone"
class="input"
required>

</div>

<div>

<label class="block mb-2">

Country

</label>

<input
type="text"
name="country"
class="input"
required>

</div>

<div>

<label class="block mb-2">

Password

</label>

<input
type="password"
name="password1"
class="input"
required>

</div>

<div>

<label class="block mb-2">

Confirm Password

</label>

<input
type="password"
name="password2"
class="input"
required>

</div>

</div>

<button class="btn mt-8">

Create Account

</button>

</form>

<p class="text-center mt-8 text-zinc-500">

Already have an account?

<a
href="{% url 'login' %}"
class="text-red-500">

Login

</a>

</p>

</div>

</div>

</body>

</html>
