{% extends "base.html" %}


{% block title %}
Forgot Password
{% endblock %}



{% block content %}


<div class="min-h-screen flex items-center justify-center px-4 py-10">


<div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-8">



<!-- ICON -->

<div class="text-center mb-8">


<div class="mx-auto bg-secondary text-white w-16 h-16 rounded-full flex items-center justify-center">


<i data-lucide="key-round" class="w-8 h-8"></i>


</div>



<h1 class="text-3xl font-bold text-primary mt-5">

Reset Password

</h1>



<p class="text-gray-600 mt-2">

Enter your email and we will send password reset instructions.

</p>


</div>







<form method="POST">


{% csrf_token %}





<div class="mb-6">


<label class="block font-semibold mb-2">

Email Address

</label>



<div class="relative">


<i data-lucide="mail"

class="absolute left-4 top-3.5 text-gray-400 w-5">

</i>




<input

type="email"

name="email"

required

placeholder="Enter your email"

class="w-full border rounded-xl pl-12 px-4 py-3 focus:ring-2 focus:ring-blue-500"

>


</div>


</div>







<button

class="w-full bg-primary text-white py-3 rounded-xl font-semibold hover:bg-blue-900 transition flex justify-center items-center gap-2"

>


<i data-lucide="send" class="w-5"></i>


Send Reset Link


</button>



</form>







<div class="text-center mt-6">


<a href="{% url 'login' %}"

class="text-secondary font-semibold flex justify-center items-center gap-2">


<i data-lucide="arrow-left" class="w-4"></i>


Back to Login


</a>


</div>




</div>


</div>



{% endblock %}
