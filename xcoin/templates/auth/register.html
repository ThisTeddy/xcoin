{% load static %}
<!DOCTYPE html>
<html lang="en" x-data="{ mobile:false }">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Account | XCoin</title>

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine -->

    <script defer
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js">
    </script>

    <!-- Lucide -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>

        *{
            font-family:Inter,sans-serif;
        }

        html{

            scroll-behavior:smooth;

        }

        body{

            background:#050505;
            color:white;
            overflow-x:hidden;

            background-image:
            radial-gradient(circle at top right,
            rgba(220,38,38,.12),
            transparent 30%),

            radial-gradient(circle at bottom left,
            rgba(127,29,29,.10),
            transparent 35%);

        }

        input,
        select{

            width:100%;
            background:#0d0d0d;

            border:1px solid #222;

            border-radius:14px;

            padding:16px 18px;

            transition:.25s;

            color:white;

        }

        input:focus,
        select:focus{

            outline:none;

            border-color:#dc2626;

            box-shadow:
            0 0 0 4px
            rgba(220,38,38,.15);

        }

        label{

            display:block;

            margin-bottom:8px;

            color:#a1a1aa;

            font-size:.87rem;

            font-weight:500;

        }

        .line{

            border-color:#1a1a1a;

        }

        .red-btn{

            background:#dc2626;

            transition:.3s;

        }

        .red-btn:hover{

            background:#b91c1c;

        }

        .glass{

            background:rgba(255,255,255,.03);

            border:1px solid rgba(255,255,255,.06);

            backdrop-filter:blur(18px);

        }

    </style>

</head>

<body>

<!-- ================================================= -->
<!-- NAVBAR -->
<!-- ================================================= -->

<section class="min-h-screen flex items-center py-16">

    <div class="max-w-md mx-auto w-full px-6">

        <!-- Logo -->

        <a href="{% url 'home' %}"
           class="inline-flex items-center gap-3">

            <div class="w-11 h-11 rounded-xl bg-red-600 flex items-center justify-center">

                <i data-lucide="bitcoin" class="w-6 h-6"></i>

            </div>

            <div>

                <h2 class="font-black text-2xl">

                    XCoin

                </h2>

            </div>

        </a>


        <!-- Heading -->

        <div class="mt-12">

            <h1 class="text-4xl font-black tracking-tight">

                Create account

            </h1>

            <p class="mt-3 text-zinc-400">

                Start investing in minutes.

            </p>

        </div>


        <!-- Google -->

        <button
        class="mt-10

        h-12

        w-full

        rounded-xl

        border

        border-zinc-800

        bg-zinc-950

        hover:bg-zinc-900

        transition

        flex

        items-center

        justify-center

        gap-3">

            <svg
            width="20"
            height="20"
            viewBox="0 0 48 48">

                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12S17.4 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>

            </svg>

            Continue with Google

        </button>


        <!-- Divider -->

        <div class="my-8 flex items-center">

            <div class="flex-1 h-px bg-zinc-800"></div>

            <span class="px-4 text-xs uppercase tracking-widest text-zinc-500">

                OR

            </span>

            <div class="flex-1 h-px bg-zinc-800"></div>

        </div>


        <!-- Form -->

        <form
        method="POST"
        action="{% url 'register' %}"

        class="space-y-5">

            {% csrf_token %}
            <section>

                <label
                class="block
                text-sm
                text-zinc-300
                mb-2">
            
                    Email Address
            
                </label>
            
                <input
            
                type="email"
            
                name="email"
            
                placeholder="you@example.com"
            
                class="w-full
            
                h-12
            
                rounded-lg
            
                border
            
                border-zinc-800
            
                bg-zinc-950
            
                px-4
            
                text-sm
            
                placeholder:text-zinc-600
            
                transition
            
                focus:border-red-600
            
                focus:ring-4
            
                focus:ring-red-600/10
            
                outline-none">
            
            </section>
            <!-- ===================================== -->
<!-- NAME -->
<!-- ===================================== -->

<section class="grid grid-cols-2 gap-4">

    <div>

        <label>

            First Name

        </label>

        <input

        type="text"

        name="first_name"

        placeholder="John"

        class="w-full
        h-12
        rounded-lg
        bg-zinc-950
        border
        border-zinc-800
        px-4
        text-sm
        outline-none
        transition
        focus:border-red-600
        focus:ring-4
        focus:ring-red-600/10"

        required>

    </div>

    <div>

        <label>

            Last Name

        </label>

        <input

        type="text"

        name="last_name"

        placeholder="Doe"

        class="w-full
        h-12
        rounded-lg
        bg-zinc-950
        border
        border-zinc-800
        px-4
        text-sm
        outline-none
        transition
        focus:border-red-600
        focus:ring-4
        focus:ring-red-600/10"

        required>

    </div>

</section>


<!-- ===================================== -->
<!-- USERNAME -->
<!-- ===================================== -->

<section>

    <label>

        Username

    </label>

    <div class="relative">

        <i
        data-lucide="at-sign"
        class="absolute
        left-4
        top-1/2
        -translate-y-1/2
        w-4
        h-4
        text-zinc-500">

        </i>

        <input

        type="text"

        name="username"

        placeholder="johndoe"

        class="w-full
        h-12
        rounded-lg
        bg-zinc-950
        border
        border-zinc-800
        pl-11
        pr-4
        text-sm
        outline-none
        transition
        focus:border-red-600
        focus:ring-4
        focus:ring-red-600/10"

        required>

    </div>

</section>


<!-- ===================================== -->
<!-- EMAIL -->
<!-- ===================================== -->

<section>

    <label>

        Email Address

    </label>

    <div class="relative">

        <i
        data-lucide="mail"
        class="absolute
        left-4
        top-1/2
        -translate-y-1/2
        w-4
        h-4
        text-zinc-500">

        </i>

        <input

        type="email"

        name="email"

        placeholder="john@example.com"

        class="w-full
        h-12
        rounded-lg
        bg-zinc-950
        border
        border-zinc-800
        pl-11
        pr-4
        text-sm
        outline-none
        transition
        focus:border-red-600
        focus:ring-4
        focus:ring-red-600/10"

        required>

    </div>

</section>


<!-- ===================================== -->
<!-- COUNTRY + PHONE -->
<!-- ===================================== -->

<section class="grid grid-cols-2 gap-4">

    <div>

        <label>

            Country

        </label>

        <select

        name="country"

        class="w-full
        h-12
        rounded-lg
        bg-zinc-950
        border
        border-zinc-800
        px-4
        text-sm
        outline-none
        transition
        focus:border-red-600
        focus:ring-4
        focus:ring-red-600/10"

        required>

            <option value="">Country</option>

            <option>Nigeria</option>

            <option>United States</option>

            <option>United Kingdom</option>

            <option>Canada</option>

            <option>Germany</option>

            <option>France</option>

            <option>South Africa</option>

        </select>

    </div>

    <div>

        <label>

            Phone

        </label>

        <input

        type="text"

        name="phone"

        placeholder="+234..."

        class="w-full
        h-12
        rounded-lg
        bg-zinc-950
        border
        border-zinc-800
        px-4
        text-sm
        outline-none
        transition
        focus:border-red-600
        focus:ring-4
        focus:ring-red-600/10"

        required>

    </div>

</section>
<!-- ===================================== -->
<!-- PASSWORDS -->
<!-- ===================================== -->

<section class="grid md:grid-cols-2 gap-4">

    <!-- Password -->

    <div
    x-data="{ show:false }">

        <label>

            Password

        </label>

        <div class="relative">

            <i
            data-lucide="lock"
            class="absolute
            left-4
            top-1/2
            -translate-y-1/2
            w-4
            h-4
            text-zinc-500">
            </i>

            <input

            :type="show ? 'text' : 'password'"

            name="password"

            placeholder="Create password"

            class="w-full
            h-12
            rounded-lg
            bg-zinc-950
            border
            border-zinc-800
            pl-11
            pr-12
            text-sm
            outline-none
            transition
            focus:border-red-600
            focus:ring-4
            focus:ring-red-600/10"

            required>

            <button
            type="button"
            @click="show=!show"
            class="absolute
            right-4
            top-1/2
            -translate-y-1/2
            text-zinc-500
            hover:text-white">

                <i
                x-show="!show"
                data-lucide="eye"
                class="w-4 h-4">
                </i>

                <i
                x-show="show"
                data-lucide="eye-off"
                class="w-4 h-4">
                </i>

            </button>

        </div>

    </div>

    <!-- Confirm -->

    <div
    x-data="{ show:false }">

        <label>

            Confirm Password

        </label>

        <div class="relative">

            <i
            data-lucide="lock"
            class="absolute
            left-4
            top-1/2
            -translate-y-1/2
            w-4
            h-4
            text-zinc-500">
            </i>

            <input

            :type="show ? 'text' : 'password'"

            name="confirm_password"

            placeholder="Repeat password"

            class="w-full
            h-12
            rounded-lg
            bg-zinc-950
            border
            border-zinc-800
            pl-11
            pr-12
            text-sm
            outline-none
            transition
            focus:border-red-600
            focus:ring-4
            focus:ring-red-600/10"

            required>

            <button
            type="button"
            @click="show=!show"
            class="absolute
            right-4
            top-1/2
            -translate-y-1/2
            text-zinc-500
            hover:text-white">

                <i
                x-show="!show"
                data-lucide="eye"
                class="w-4 h-4">
                </i>

                <i
                x-show="show"
                data-lucide="eye-off"
                class="w-4 h-4">
                </i>

            </button>

        </div>

    </div>

</section>


<!-- Password Hint -->

<section>

    <div
    class="flex
    items-center
    justify-between
    text-xs
    text-zinc-500">

        <span>

            Use at least 8 characters

        </span>

        <span class="text-green-500">

            Strong passwords recommended

        </span>

    </div>

</section>


<!-- ===================================== -->
<!-- REFERRAL -->
<!-- ===================================== -->

<section>

    <label>

        Referral Code

        <span class="text-zinc-600">

            (Optional)

        </span>

    </label>

    <div class="relative">

        <i
        data-lucide="gift"
        class="absolute
        left-4
        top-1/2
        -translate-y-1/2
        w-4
        h-4
        text-zinc-500">
        </i>

        <input

        type="text"

        name="referral_code"

        placeholder="Referral code"

        class="w-full
        h-12
        rounded-lg
        bg-zinc-950
        border
        border-zinc-800
        pl-11
        pr-4
        text-sm
        outline-none
        transition
        focus:border-red-600
        focus:ring-4
        focus:ring-red-600/10">

    </div>

</section>


<!-- ===================================== -->
<!-- TERMS -->
<!-- ===================================== -->

<section>

    <label class="flex items-start gap-3 cursor-pointer">

        <input

        type="checkbox"

        required

        class="mt-1
        accent-red-600">

        <span
        class="text-sm
        text-zinc-400
        leading-6">

            I agree to the

            <a
            href="{% url 'terms_and_conditions' %}"
            class="text-red-500 hover:text-red-400">

                Terms

            </a>

            and

            <a
            href="{% url 'privacy_policy' %}"
            class="text-red-500 hover:text-red-400">

                Privacy Policy

            </a>

        </span>

    </label>

</section>


<!-- ===================================== -->
<!-- BUTTON -->
<!-- ===================================== -->

<section>

    <button

    type="submit"

    class="w-full
    h-12
    rounded-lg
    bg-red-600
    hover:bg-red-700
    transition-all
    duration-300
    font-semibold
    flex
    items-center
    justify-center
    gap-2">

        <i
        data-lucide="user-plus"
        class="w-5 h-5">
        </i>

        Create Account

    </button>

</section>


<section class="text-center pt-2">

    <p class="text-sm text-zinc-500">

        Already have an account?

        <a
        href="{% url 'login' %}"
        class="text-red-500 font-medium hover:text-red-400">

            Sign In

        </a>

    </p>

</section>

</form>

</div>

</section>

<script>
    lucide.createIcons();
</script>

</body>
</html>
