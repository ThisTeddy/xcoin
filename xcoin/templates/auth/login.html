{% load static %}

<!DOCTYPE html>
<html lang="en" x-data="{ showPassword:false }">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | XCoin</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <style>

        *{
            font-family:Inter,sans-serif;
        }

        body{

            background:#070707;

            color:white;

        }

        .glass{

            background:rgba(255,255,255,.05);

            backdrop-filter:blur(20px);

            border:1px solid rgba(255,255,255,.08);

        }

        .input{

            width:100%;

            height:50px;

            background:#111;

            border:1px solid #27272a;

            border-radius:14px;

            padding:0 16px;

            color:white;

            transition:.3s;

        }

        .input:focus{

            outline:none;

            border-color:#dc2626;

            box-shadow:0 0 0 4px rgba(220,38,38,.15);

        }

    </style>

</head>

<body>

<section class="min-h-screen flex items-center justify-center px-4 py-10">

<div class="w-full max-w-md">

<div class="text-center mb-8">

<a href="/"
class="text-4xl font-black">

<span class="text-red-600">

X

</span>Coin

</a>

<p class="text-zinc-400 mt-3">

Welcome back

</p>

</div>

<div class="glass rounded-3xl p-6 sm:p-8">

<h1 class="text-3xl font-black">

Sign In

</h1>

<p class="text-zinc-400 mt-2">

Login to access your investment dashboard.

</p>

{% if messages %}

<div class="mt-6 space-y-3">

{% for message in messages %}

<div class="rounded-xl px-4 py-3 text-sm
{% if message.tags == 'success' %}
bg-green-600/20 text-green-400 border border-green-600/30
{% else %}
bg-red-600/20 text-red-300 border border-red-600/30
{% endif %}">

{{ message }}

</div>

{% endfor %}

</div>

{% endif %}

<form method="POST" class="mt-8 space-y-5">

{% csrf_token %}
<!-- Email -->

<div>

<label class="block text-sm mb-2 font-medium">

Email Address

</label>

<input
type="email"
name="email"
class="input"
placeholder="john@example.com"
required>

</div>

<!-- Password -->

<div x-data="{show:false}">

<label class="block text-sm mb-2 font-medium">

Password

</label>

<div class="relative">

<input
:type="show ? 'text':'password'"
name="password"
class="input pr-12"
placeholder="Enter your password"
required>

<button
type="button"
@click="show=!show"
class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white">

<i
x-show="!show"
data-lucide="eye"
class="w-5 h-5"></i>

<i
x-show="show"
data-lucide="eye-off"
class="w-5 h-5"></i>

</button>

</div>

</div>

<div class="flex justify-between items-center text-sm">

<label class="flex items-center gap-2">

<input
type="checkbox"
name="remember_me"
class="accent-red-600">

<span class="text-zinc-400">

Remember me

</span>

</label>

<a
href="{% url 'forgot_password' %}"
class="text-red-500 hover:text-red-400">

Forgot Password?

</a>

</div>

<button
type="submit"
class="w-full h-12 rounded-xl bg-red-600 hover:bg-red-700 transition font-semibold shadow-lg shadow-red-600/20">

Sign In

</button>

<div class="relative py-2">

<div class="absolute inset-0 flex items-center">

<div class="w-full border-t border-zinc-800"></div>

</div>

<div class="relative flex justify-center">

<span class="bg-[#070707] px-4 text-zinc-500 text-sm">

OR

</span>

</div>

</div>

<p class="text-center text-zinc-400 text-sm">

Don't have an account?

<a
href="{% url 'register' %}"
class="text-red-500 font-semibold hover:text-red-400">

Create Account

</a>

</p>

</form>

</div>

<div class="text-center mt-8">

<a
href="/"
class="inline-flex items-center gap-2 text-zinc-500 hover:text-white transition">

<i data-lucide="arrow-left"
class="w-4 h-4"></i>

Back to Home

</a>

</div>

</div>

</section>

<script>

document.addEventListener("DOMContentLoaded",()=>{

lucide.createIcons();

});

</script>

</body>

</html>
