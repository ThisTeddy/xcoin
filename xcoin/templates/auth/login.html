{% extends "base.html" %}


{% block title %}
Login
{% endblock %}




{% block content %}


<div class="min-h-screen flex items-center justify-center px-4 py-10">



<div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-8">





<!-- HEADER -->

<div class="text-center mb-8">


<div class="mx-auto bg-primary text-white w-16 h-16 rounded-full flex items-center justify-center text-2xl">


<i class="fa-solid fa-lock"></i>


</div>



<h1 class="text-3xl font-bold text-primary mt-4">

Welcome Back

</h1>



<p class="text-gray-600 mt-2">

Login to access your account.

</p>


</div>







<form method="POST">


{% csrf_token %}






<!-- EMAIL -->


<div class="mb-5">


<label class="block font-semibold mb-2">

Email Address

</label>



<div class="relative">


<span class="absolute left-4 top-3 text-gray-400">

<i class="fa-solid fa-envelope"></i>

</span>


<input

type="email"

name="email"

required

class="w-full border rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-blue-500"

placeholder="Enter your email"

>


</div>


</div>







<!-- PASSWORD -->


<div class="mb-5">


<label class="block font-semibold mb-2">

Password

</label>



<div class="relative">


<span class="absolute left-4 top-3 text-gray-400">

<i class="fa-solid fa-key"></i>

</span>



<input

type="password"

name="password"

required

class="w-full border rounded-xl pl-12 pr-4 py-3"

placeholder="Enter your password"

>


</div>


</div>






<!-- REMEMBER + FORGOT -->


<div class="flex justify-between items-center mb-6">


<label class="flex items-center gap-2 text-sm">


<input

type="checkbox"

class="rounded"

>


Remember me


</label>




<a href="{% url 'forgot_password' %}"

class="text-secondary text-sm font-semibold">


Forgot Password?


</a>



</div>








<button

type="submit"

class="w-full bg-primary text-white py-3 rounded-xl font-semibold hover:bg-blue-900 transition"

>


Login


</button>




</form>








<!-- REGISTER -->


<div class="text-center mt-6 text-gray-600">


Don't have an account?


<a href="{% url 'register' %}"

class="text-secondary font-bold">


Create Account


</a>


</div>






</div>


</div>



{% endblock %}
