{% extends "base.html" %}


{% block title %}
Change Password
{% endblock %}



{% block content %}


<div class="min-h-screen flex items-center justify-center px-4 py-10">


<div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-8">





<!-- HEADER -->

<div class="text-center mb-8">


<div class="mx-auto bg-primary text-white w-16 h-16 rounded-full flex items-center justify-center">


<i data-lucide="shield-check" class="w-8 h-8"></i>


</div>



<h1 class="text-3xl font-bold text-primary mt-5">

Change Password

</h1>



<p class="text-gray-600 mt-2">

Update your account security password.

</p>


</div>








<form method="POST">


{% csrf_token %}






<!-- OLD PASSWORD -->


<div class="mb-5">


<label class="block font-semibold mb-2">

Current Password

</label>


<div class="relative">


<i data-lucide="lock"

class="absolute left-4 top-3.5 text-gray-400 w-5">

</i>



<input

type="password"

name="old_password"

required

class="w-full border rounded-xl pl-12 px-4 py-3"

placeholder="Current password"

>


</div>


</div>









<!-- NEW PASSWORD -->


<div class="mb-5">


<label class="block font-semibold mb-2">

New Password

</label>


<div class="relative">


<i data-lucide="key-round"

class="absolute left-4 top-3.5 text-gray-400 w-5">

</i>



<input

type="password"

name="new_password"

required

class="w-full border rounded-xl pl-12 px-4 py-3"

placeholder="New password"

>


</div>


</div>








<!-- CONFIRM PASSWORD -->


<div class="mb-6">


<label class="block font-semibold mb-2">

Confirm New Password

</label>



<div class="relative">


<i data-lucide="check-circle"

class="absolute left-4 top-3.5 text-gray-400 w-5">

</i>



<input

type="password"

name="confirm_password"

required

class="w-full border rounded-xl pl-12 px-4 py-3"

placeholder="Confirm password"

>


</div>


</div>








<button

type="submit"

class="w-full bg-secondary text-white py-3 rounded-xl font-semibold hover:opacity-90 transition flex justify-center items-center gap-2"

>


<i data-lucide="save" class="w-5"></i>


Update Password


</button>




</form>









<div class="text-center mt-6">


<a href="{% url 'profile' %}"

class="text-primary font-semibold flex justify-center items-center gap-2">


<i data-lucide="arrow-left" class="w-4"></i>


Back to Profile


</a>


</div>





</div>


</div>



{% endblock %}
